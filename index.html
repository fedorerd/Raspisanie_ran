<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>УИТП-26 — расписание</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <p class="eyebrow">РАНХиГС · Магистратура</p>
      <div class="title-row"><h1>УИТП-26</h1><span class="badge">локально</span></div>
      <p id="subtitle">Загружаем расписание…</p>
    </header>
    <section class="controls" aria-label="Управление расписанием">
      <button id="previous" aria-label="Предыдущая неделя">‹</button>
      <button id="today">Сегодня</button>
      <button id="next" aria-label="Следующая неделя">›</button>
      <label class="select-label">Преподаватель
        <select id="teacher"><option value="">Все преподаватели</option></select>
      </label>
    </section>
    <section class="week" id="week" aria-live="polite"></section>
    <section class="day-header"><div><p class="eyebrow">Выбранный день</p><h2 id="day-title"></h2></div><span id="lesson-count"></span></section>
    <section id="lessons" class="lessons"></section>
    <footer>Данные хранятся на устройстве. Обновление — через новый файл расписания.</footer>
  </main>
  <template id="lesson-template"><article class="lesson-card"><div class="lesson-time"></div><div class="lesson-main"><h3></h3><p class="teacher-name"></p><p class="lesson-detail"></p></div><button class="calendar">В календарь</button></article></template>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
